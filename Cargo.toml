[package]
name = "oc-voice"
version = "0.1.0"
edition = "2021"
description = "Voice dictation and window control for Hyprland, fully local"
license = "MIT"
authors = ["Nicolas Van Klaveren"]
readme = "README.md"
keywords = ["voice", "dictation", "whisper", "hyprland", "speech-recognition"]
categories = ["command-line-utilities", "multimedia::audio"]
repository = "https://github.com/nklaveren/oc-voice"

[[bin]]
name = "oc-voice"
path = "src/main.rs"

[dependencies]
# audio capture
cpal = "0.15"
# whisper local
whisper-rs = { version = "0.14", default-features = false }
# ring buffer for streaming audio
ringbuf = "0.4"
# high quality resampling (replaces naive nearest-neighbour downsampling)
rubato = "0.16"
# voice activity detection (silero v5 via ort). load-dynamic avoids build-time downloads.
voice_activity_detector = { version = "0.2", features = ["load-dynamic"] }
# M7.4: speaker embeddings through the same runtime the VAD already loads.
# Version-pinned to whatever voice_activity_detector resolved, so cargo unifies
# them into one onnxruntime rather than linking two.
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"] }
ndarray = "0.16"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# errors
anyhow = "1"
# channels
crossbeam-channel = "0.5"
# misc
ctrlc = "3"
num_cpus = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# en->pt translation for the overlay (M7.2); model converted by `just fetch-mt`
ct2rs = "0.9"
# session timestamps (M7.1)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# CDP over WebSocket, for asking a page what is on it. No TLS: the endpoint
# is a loopback port the user opened themselves, and pulling rustls in for
# 127.0.0.1 would be the largest dependency in the tree for nothing.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# string similarity for the command matcher (Jaro-Winkler) — M1.1
strsim = "0.11"
# overlay GUI (floating subtitle-style window)
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# M6.1: the overlay as a wlr layer surface instead of an application window.
# Every one of these is already in the lock via eframe, so the feature costs
# no new transitive dependency and no egui version bump — it only stops them
# from being reached exclusively through winit.
smithay-client-toolkit = { version = "0.21", optional = true }
wayland-client = { version = "0.31", optional = true }
glutin = { version = "0.32", optional = true, default-features = false, features = ["egl", "wayland"] }
egui_glow = { version = "0.34", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
# macOS GPU path: whisper.cpp Metal backend
metal = ["whisper-rs/metal"]
cpu = []
# Draw the overlay on a zwlr_layer_shell_v1 surface (M6.1). Off by default
# until it has proven pointer input and fractional scaling on real hardware —
# the eframe host stays the one that ships.
layer-shell = [
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:glutin",
    "dep:egui_glow",
    "dep:raw-window-handle",
]

[profile.release]
lto = "thin"
codegen-units = 1
