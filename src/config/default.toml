# Default voice-command vocabulary, embedded in the binary.
# A user file at ~/.config/oc-voice/commands.toml overrides per language:
# a language section defined there fully replaces the embedded one.
#
# Languages without a section here (e.g. ja, zh) still transcribe and dictate
# normally — they just never fire commands. The matcher's word-count gate and
# diacritic fold assume space-separated alphabetic script; see M1.3 in
# BACKLOG.md.

[matching]
threshold = 0.82
# Ações que nunca disparam direto: pedem um "confirma" falado antes. Fechar
# uma janela não tem desfazer, e a fala que pede isso passou por um
# reconhecedor.
destructive = ["kill_active", "close_window"]

# Os idiomas que realmente se fala aqui. Uma detecção fora desta lista é
# ruído, não discordância — whisper nomeia qualquer um dos cem idiomas dele
# com evidência fina, e três segundos de fala é evidência fina. Um log real
# trouxe "de (p = 0.198)" numa frase em português, e o texto voltou em alemão.
# Lista vazia aceita qualquer coisa.
[asr]
languages = ["pt", "en"]

# Where the floating overlay lands. "middle" | "left" | "right" | "focused",
# or a connector name such as "DP-1". Monitors are ordered by their global x,
# left to right — not by the order hyprctl reports them.
[overlay]
monitor = "middle"
# Qual protocolo de superfície desenha o overlay: "auto" | "layer" | "toplevel".
#
# "toplevel" é uma janela de aplicativo comum — o compositor a encaixa no
# tiling e dá foco a ela, e há uma thread desfazendo isso por fora depois.
# "layer" é uma zwlr_layer_surface_v1: nunca entra no tiling e nunca recebe
# foco, por construção, e a âncora é declarada em vez de calculada.
#
# "auto" usa layer quando o binário foi compilado com --features layer-shell,
# e toplevel caso contrário. A escolha é de runtime, e não de compilação, para
# dar para comparar os dois sem recompilar — que é o único jeito de responder
# se o host novo acerta ponteiro e escala.
surface = "auto"

# Alcançar abas do navegador. Um navegador inteiro é UMA janela para o
# compositor, então qualquer coisa guardada em aba é invisível para
# `hyprctl clients` — que é como a maioria das pessoas guarda a maioria das
# coisas. Desligado por padrão: ninguém deve ter uma porta de depuração
# aberta sem pedir. Para ligar, suba o navegador com
# `--remote-debugging-port=9222` e descomente:
#
#   [browser]
#   debug_port = 9222

# How the VAD closes a segment. Override either profile, or single fields of
# one, in ~/.config/oc-voice/commands.toml; unnamed fields keep these values.
#
#   [segmentation.subtitle]
#   hang_ms = 400
#
# dictation: speaking yourself, where thinking pauses are long.
# subtitle:  following a meeting, where a pause usually means someone else is
#            about to speak — closing on it keeps one voice per segment.
[segmentation.dictation]
hang_ms = 960
max_seconds = 20
partial_every_ms = 900
# Audio kept ahead of the VAD's decision. A word's soft onset sits below the
# speech threshold for the first few 32 ms frames; without this it is thrown
# away. A long sentence loses a syllable, a short command loses everything.
preroll_ms = 300

[segmentation.subtitle]
hang_ms = 320
max_seconds = 8
partial_every_ms = 700
preroll_ms = 300

[pt]
prefix = ["computador"]
send_to = ["enviar para", "envia para", "enviar pelo", "envia pelo", "enviar via", "envia via", "enviar pro", "envia pro", "manda para", "manda pelo", "manda via", "manda pro"]
send = ["câmbio", "cambio", "envia", "enviar", "manda", "mandar", "pronto", "vai", "manda ver", "pode enviar", "pode mandar"]
cancel = ["cancela", "cancelar", "limpa", "limpar", "descarta", "descartar", "apaga", "apagar", "esquece"]
newline = ["nova linha", "pula linha"]
session_start = ["grava", "gravar", "gravar sessão", "inicia sessão"]
session_stop = ["encerra", "encerrar", "encerra sessão", "para de gravar"]
help = ["ajuda", "comandos", "socorro"]
confirm = ["confirma", "sim"]
deny = ["não", "cancela"]
# Palavras que cercam comandos na fala real. Saem antes da contagem de
# palavras, e só estas — qualquer palavra desconhecida mantém a fala como
# ditado, que é o que impede "vamos limpar depois" de virar um comando.
fillers = ["ok", "tá", "ta", "então", "entao", "aí", "ai", "isso", "tudo", "agora", "beleza", "por favor"]

# Rótulos da listagem de "ajuda". A chave é o nome neutro da ação.
[pt.help_labels]
send = "enviar"
cancel = "cancelar"
newline = "nova linha"
session_start = "gravar"
session_stop = "encerrar"
help = "ajuda"
modes = "modos"
send_to = "enviar p/"
templates = "janelas"

[pt.numbers]
um = 1
uma = 1
dois = 2
duas = 2
"três" = 3
"tres" = 3
quatro = 4
cinco = 5
seis = 6
sete = 7
oito = 8
nove = 9
dez = 10

# Trocar de modo sem tocar no overlay. O nome à direita é neutro de idioma.
# Só existem dois modos: sua voz, e o áudio do sistema. As frases antigas
# ("modo ditado", "modo comando") continuam valendo e caem no modo que as
# absorveu — quem falava assim não precisa reaprender.
[pt.modes]
"modo microfone" = "enter"
"modo ditado" = "enter"
"modo texto" = "enter"
"modo comando" = "enter"
"modo mensagem" = "enter"
# O rótulo do overlay é "Agent"; a frase falada acompanha, sem tirar as
# antigas — trocar o nome de um modo não pode calar quem já dizia o outro.
"modo agente" = "enter"
"modo reunião" = "translate"
"modo legenda" = "translate"
"modo sistema" = "translate"
"modo meeting" = "translate"

[pt.directions]
direita = "r"
direito = "r"
esquerda = "l"
esquerdo = "l"
cima = "u"
baixo = "d"
meio = "m"
centro = "m"

[pt.wm_commands]
"tela cheia" = "fullscreen"
"flutuante" = "toggle_floating"
"fecha" = "kill_active"
"fechar janela" = "kill_active"
# Frases ditas na prática que não estavam na tabela — o vocabulário estava
# incompleto, não o código. "trocar tela" alterna para a última janela.
"trocar tela" = "next_window"
"troca tela" = "next_window"
"próxima janela" = "next_window"
"proxima janela" = "next_window"
"volta janela" = "previous_window"
"janela anterior" = "previous_window"

# A forma com slot fechado vem antes de "monitor {monitor}": em empate de
# escore o primeiro template vence, e "monitor esquerda" deve ser direção,
# não um monitor chamado "esquerda".
[[pt.templates]]
pattern = "monitor {direcao}"
action = "focus_monitor"

[[pt.templates]]
pattern = "monitor da {direcao}"
action = "focus_monitor"

[[pt.templates]]
pattern = "monitor do {direcao}"
action = "focus_monitor"

[[pt.templates]]
pattern = "monitor {monitor}"
action = "focus_monitor_name"

[[pt.templates]]
pattern = "janela da {direcao}"
action = "move_focus"

[[pt.templates]]
pattern = "janela de {direcao}"
action = "move_focus"

# "área de trabalho três" é impronunciável no meio de uma reunião. As formas
# curtas são as que saem na fala; a longa fica por compatibilidade.
# "workspace" é dito em inglês no meio da frase em português — é assim que
# sai na fala, e o vocabulário serve a fala, não à gramática.
[[pt.templates]]
pattern = "workspace {numero}"
action = "workspace"

[[pt.templates]]
pattern = "vai pro workspace {numero}"
action = "workspace"

[[pt.templates]]
pattern = "vai para o workspace {numero}"
action = "workspace"

[[pt.templates]]
pattern = "vai pra {numero}"
action = "workspace"

[[pt.templates]]
pattern = "vai para {numero}"
action = "workspace"

[[pt.templates]]
pattern = "área {numero}"
action = "workspace"

[[pt.templates]]
pattern = "espaço {numero}"
action = "workspace"

[[pt.templates]]
pattern = "área de trabalho {numero}"
action = "workspace"

# Whisper normalizes the spoken contraction "pra" to "para", so the expanded
# form is what actually arrives — it gets its own template instead of
# scraping the threshold at 0.82 through fuzzy match.
[[pt.templates]]
pattern = "leva pra {numero}"
action = "move_to_workspace"

[[pt.templates]]
pattern = "leva para {numero}"
action = "move_to_workspace"

[[pt.templates]]
pattern = "manda pra {numero}"
action = "move_to_workspace"

[[pt.templates]]
pattern = "manda para {numero}"
action = "move_to_workspace"

# "foca o teams" não é como ninguém pede uma janela. Estas são.
[[pt.templates]]
pattern = "vai pro {alvo}"
action = "focus_window"

[[pt.templates]]
pattern = "vai para o {alvo}"
action = "focus_window"

[[pt.templates]]
pattern = "abre o {alvo}"
action = "focus_window"

[[pt.templates]]
pattern = "mostra o {alvo}"
action = "focus_window"

[[pt.templates]]
pattern = "foca o {alvo}"
action = "focus_window"

[[pt.templates]]
pattern = "foca no {alvo}"
action = "focus_window"

# Fechar o que se NOMEIA. "Fechar Teams." pontuava 0.87 contra "fechar
# janela" em `wm_commands`, fechava a janela em foco e jogava fora a palavra
# que dizia o que fechar. As duas formas convivem: sem alvo, fecha a de foco;
# com alvo, fecha aquela — e um alvo que não existe não fecha nada.
[[pt.templates]]
pattern = "fecha o {alvo}"
action = "close_window"

[[pt.templates]]
pattern = "fecha a {alvo}"
action = "close_window"

[[pt.templates]]
pattern = "fecha {alvo}"
action = "close_window"

[[pt.templates]]
pattern = "fechar o {alvo}"
action = "close_window"

[[pt.templates]]
pattern = "fechar {alvo}"
action = "close_window"

# Agir DENTRO da página, não sobre a janela. O navegador sabe o que é botão e
# onde ele está; OCR só enxerga pixels. Só dispara quando há exatamente um
# candidato — "reply" aparecia três vezes numa página só, e clicar no errado
# não tem desfazer nem aviso.
[[pt.templates]]
pattern = "clica em {alvo}"
action = "click_text"

[[pt.templates]]
pattern = "clica no {alvo}"
action = "click_text"

[[pt.templates]]
pattern = "clica na {alvo}"
action = "click_text"

[[pt.templates]]
pattern = "clica {alvo}"
action = "click_text"

# Focar um campo é o que realmente se quer ao "clicar num input", e não
# precisa de coordenada nenhuma.
[[pt.templates]]
pattern = "campo {alvo}"
action = "focus_field"

[[pt.templates]]
pattern = "escreve em {alvo}"
action = "focus_field"

[pt.targets]
navegador = ["firefox", "brave", "chromium", "chrome", "zen", "vivaldi"]
terminal = ["alacritty", "kitty", "foot", "wezterm", "ghostty"]
editor = ["code", "nvim", "zed", "emacs"]
chat = ["discord", "telegram", "slack", "teams", "element"]

